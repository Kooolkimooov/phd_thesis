permissions:
    contents: write
    
name: build
on:
  push:
    tags:
      - v*
  schedule:
    - cron: "00 20 * * *" 
  workflow_dispatch:

jobs:
    check:
      runs-on: ubuntu-latest
      steps:
        - name: checkout 
          uses: actions/checkout@v4

        - name: determine if build is needed
          id: determine_build
          uses: actions/github-script@v6
          with:
            script: |
              // Is this a tagged release?
              const isTaggedRelease = context.ref.startsWith('refs/tags/') && context.eventName === 'push';
              core.setOutput('is_release', isTaggedRelease.toString());

              // Get all tags
              const { data: tags } = await github.rest.git.listMatchingRefs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/'
              });

              let hasTagOnCurrentCommit = false;
              for (const tag of tags) {
                if (tag.object && tag.object.sha) {
                  if (tag.object.type === 'commit' && tag.object.sha === context.sha) {
                    hasTagOnCurrentCommit = true;
                    break;
                  }
                  if (tag.object.type === 'tag') {
                    // Fetch the tag object to get the commit SHA
                    const tagObj = await github.rest.git.getTag({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      tag_sha: tag.object.sha
                    });
                    if (tagObj.data.object.sha === context.sha) {
                      hasTagOnCurrentCommit = true;
                      break;
                    }
                  }
                }
              }
              core.setOutput('has_tag', hasTagOnCurrentCommit.toString());

              // Only build if:
              // 1. This is a tagged release, OR
              // 2. This is a scheduled/manual run AND the commit doesn't have a tag
              let needsBuild = false;
              if (isTaggedRelease) {
                needsBuild = true;
              } else if ((context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') && !hasTagOnCurrentCommit) {
                needsBuild = true;
              }

              core.setOutput('needs_build', needsBuild.toString());
              core.setOutput('is_release', isTaggedRelease.toString());
              console.log(`Build needed: ${needsBuild} (Tagged release: ${isTaggedRelease}, Has tag: ${hasTagOnCurrentCommit})`);
 
        - name: bump patch version
          if: steps.determine_build.outputs.has_tag == 'false' && steps.determine_build.outputs.needs_build == 'true'
          id: tag_version
          uses: mathieudutour/github-tag-action@v6.2
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            create_annotated_tag: true
            custom_release_rules: | 
              fix:patch:fixed,
              wip:patch:work done,
              change:patch:changed

        - name: get description
          if: steps.determine_build.outputs.needs_build == 'true'
          id: get_description
          run: echo "description=${{steps.tag_version.outputs.new_tag}}-$(git log --pretty=format:"%h" -n 1)" >> $GITHUB_OUTPUT

        - name: check output
          run: |
            echo "needs_build=${{ steps.determine_build.outputs.needs_build }}" 
            echo "is_release=${{ steps.determine_build.outputs.is_release }}" 
            echo "has_tag=${{ steps.determine_build.outputs.has_tag }}"
            echo "new_tag=${{ steps.tag_version.outputs.new_tag }}"
            echo "description=${{ steps.get_description.outputs.description }}"

      outputs:
        needs_build: ${{ steps.determine_build.outputs.needs_build }}
        is_release: ${{ steps.determine_build.outputs.is_release }}
        has_tag: ${{ steps.determine_build.outputs.has_tag }}
        new_tag: ${{ steps.tag_version.outputs.new_tag }}
        description: ${{ steps.get_description.outputs.description }}
        changelog: ${{ steps.tag_version.outputs.changelog }}

    build:
      needs: check
      if: needs.check.outputs.needs_build == 'true'
      runs-on: ubuntu-latest
      container:
        image: ghcr.io/xu-cheng/texlive-full:latest
      steps:
        - name: check input
          run: |
            echo "needs_build=${{ needs.check.outputs.needs_build }}" 
            echo "is_release=${{ needs.check.outputs.is_release }}" 
            echo "has_tag=${{ needs.check.outputs.has_tag }}"
            echo "new_tag=${{ needs.check.outputs.new_tag }}"
            echo "description=${{ needs.check.outputs.description }}"

        - name: checkout
          uses: actions/checkout@v4

        - name: setup python
          uses: actions/setup-python@v5
          with:
            python-version: '>3.10'
            
        - name: build
          run: python3 ./build.py all -gd ${{ needs.check.outputs.description }}

        - name: release
          uses: softprops/action-gh-release@v2
          if: needs.check.outputs.is_release == 'true'
          with:
            make_latest: true
            body: ${{ needs.check.outputs.changelog }}
            files: out/thesis*.pdf

          
        - name: prerelease
          if: needs.check.outputs.has_tag == 'false'
          uses: softprops/action-gh-release@v2
          with:
            prerelease: true
            tag_name: ${{ needs.check.outputs.new_tag }}
            body: ${{ needs.check.outputs.changelog }}
            files: out/*.pdf

        - name: cleanup old prereleases
          uses: sgpublic/delete-release-action@v1.2
          with:
            release-drop: false
            pre-release-drop: true
            pre-release-keep-count: 0
            pre-release-drop-tag: true
            draft-drop: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}